# Forward only to the private renderer. Never use request-supplied destinations.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events { worker_connections 64; }

http {
  # Do not persist document paths, headers, bodies, or responses in proxy logs.
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 5m;
  client_body_timeout 60s;
  proxy_connect_timeout 5s;
  proxy_send_timeout 65s;
  proxy_read_timeout 65s;
  proxy_request_buffering off;
  proxy_buffering off;

  server {
    listen 8080;
    location = /health {
      limit_except GET { deny all; }
      proxy_pass http://gotenberg:3000;
    }
    location = /forms/libreoffice/convert {
      limit_except POST { deny all; }
      proxy_pass http://gotenberg:3000;
    }
    location / { return 404; }
  }
}
