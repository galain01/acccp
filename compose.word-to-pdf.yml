name: acccp-word-to-pdf

services:
  gotenberg:
    image: gotenberg/gotenberg:8.36.0-libreoffice
    environment:
      API_ENABLE_BASIC_AUTH: "true"
      GOTENBERG_API_BASIC_AUTH_USERNAME: "${GOTENBERG_USERNAME:?Set GOTENBERG_USERNAME in .env.word-to-pdf}"
      GOTENBERG_API_BASIC_AUTH_PASSWORD: "${GOTENBERG_PASSWORD:?Set GOTENBERG_PASSWORD in .env.word-to-pdf}"
      API_BODY_LIMIT: "5MB"
      API_TIMEOUT: "60s"
      API_DISABLE_DOWNLOAD_FROM: "true"
      API_ENABLE_DEBUG_ROUTE: "false"
      LIBREOFFICE_AUTO_START: "true"
      LIBREOFFICE_START_TIMEOUT: "30s"
      LIBREOFFICE_MAX_QUEUE_SIZE: "2"
      LIBREOFFICE_DENY_LIST: ".*"
      WEBHOOK_DISABLE: "true"
      PDFENGINES_DISABLE_ROUTES: "true"
    networks:
      - renderer
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777

  # Docker does not publish ports for containers attached only to an internal
  # network. This fixed-upstream proxy exposes the worker without giving the
  # worker an external network or default route.
  renderer-ingress:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    read_only: true
    depends_on:
      gotenberg:
        condition: service_started
        restart: true
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - ./docker/word-to-pdf/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      renderer: {}
      ingress:
        gw_priority: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: "0"
    mem_limit: 64m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777

networks:
  renderer:
    internal: true
  ingress:
