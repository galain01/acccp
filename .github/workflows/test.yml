name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exact production dependency versions, wheels only; no package build scripts.
      - name: Install native PDF test dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r services/native-pdf/requirements.txt

      # Synthetic fixtures and loopback HTTP only. Java tools and remote calls are mocked.
      - name: Check native PDF engine and supervisor
        timeout-minutes: 5
        run: |
          python -m pip check
          python -m unittest discover -s services/native-pdf -p "test_*.py"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Install isolated PostgreSQL test runtime
        timeout-minutes: 3
        run: npm ci --prefix .github/test-runtime --ignore-scripts

      - name: Verify submission recovery and immutable publication
        timeout-minutes: 3
        env:
          PGLITE_RUNTIME_DIR: ${{ github.workspace }}/.github/test-runtime
        run: |
          node node_modules/vitest/vitest.mjs run --config test/conversion-publication-postgres.config.mjs
          node node_modules/vitest/vitest.mjs run --config test/document-submission-postgres.config.mjs
          node node_modules/vitest/vitest.mjs run --config test/powerpoint-review-publication-postgres.config.mjs

      # Synthetic build/runtime checks: no production credentials or services.
      - name: Build and verify traced PDF rendering
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/acccp_build
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-not-a-credential
          BETTER_AUTH_SECRET: build-only-placeholder-not-a-real-secret-20261026
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify signed-out framework runtime
        timeout-minutes: 2
        run: node scripts/check-framework-runtime.mjs
